version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.multi
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker-test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: